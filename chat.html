<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vii — Chat</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="chat-shell">
  <div class="chat-header">
    <div class="avatar-mini">V</div>
    <div class="who">
      <div class="name">Vii</div>
      <div class="status" id="user-status">Online</div>
    </div>
    <button class="logout-link" id="logout-btn">Logout</button>
  </div>

  <div class="chat-body" id="chat-body"></div>

  <div class="chat-input-bar">
    <input type="text" id="chat-input" placeholder="Type pannunga..." autocomplete="off">
    <button id="send-btn">&#10148;</button>
  </div>
</div>

<script src="chat.js"></script>
</body>
</html>
